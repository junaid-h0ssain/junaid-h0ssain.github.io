name: Deploy to GitHub Pages

# Deploys the existing static site at root plus the Next.js preview under /web/.
on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: web

      - name: Build Next.js app
        run: bun run build
        working-directory: web

      - name: Assemble Pages artifact
        run: |
          mkdir -p /tmp/site/web
          # Root static site, excluding git metadata, dependencies,
          # workflows, and Next.js sources (shipped separately below).
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./.github' --exclude='./web' -cf - . | tar -xf - -C /tmp/site
          # Next.js static export, served under /web/.
          cp -r web/out/. /tmp/site/web/
          ls /tmp/site /tmp/site/web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
